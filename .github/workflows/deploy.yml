name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions minimales : lecture du code, publication sur Pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  verifier-et-construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérification TypeScript
        run: npm run typecheck
      - name: Validation du contenu pédagogique
        run: npm run validate:content
      - name: Tests unitaires
        run: npm test
      - name: Construction
        run: npm run build
      - name: Tests de bout en bout (ordinateur + mobile)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e -- --trace off
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    needs: verifier-et-construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
